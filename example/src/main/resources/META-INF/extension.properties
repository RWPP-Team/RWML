# Descriptor of the sample extension. RWML reads this before touching any class, which is why an
# extension can be listed (and enabled/disabled) without being loaded. Values here win over the
# @ExtensionInfo annotation on the entry point.
#
# It declares both halves a real extension has: the entry point that gets loaded, and the interface
# the host may start. The last line names the interface. An extension that declares no ui-framework
# changes nothing about the interface, and with no declaration anywhere the host stays headless,
# which is what a dedicated server wants.
id=com.example.rwml.hello
name=Hello Extension
version=1.0.0
mainClass=io.github.rwml.hello.HelloExtension
ui-framework=io.github.rwml.hello.HelloUi
author=RWPP Team
description=Sample RWML extension used by both the desktop demo host and the Android app.
homepage=https://github.com/RWPP-Team/RWML
tags=example,hello
