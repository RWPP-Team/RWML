# ---- 项目坐标（Maven Central）----
group=io.github.rwpp-team
version=1.0.2

# ---- 构建 ----
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true

# Android SDK 位置，仅 :android 应用需要。无需在此设置：AGP 会读取 ANDROID_HOME（或 ANDROID_SDK_ROOT），
# 若未设置，则回退到 Android Studio 写入且不会提交的 local.properties 中的 `sdk.dir`。

# ---- 游戏打包（`:packageGameJar`）----
# RWML 会作为 game-lib.jar 的替代品放入游戏：游戏代码会合并到 RWML 的 jar 中，游戏自己的入口点在其中名为
# `MainLauncher`，这是 Enigma 映射（`:remapFromEnigma`）为它指定的名称。RWML 在自身源码中提供
# `com.corrodinggames.rts.java.Main`，游戏启动器会启动这个入口。
#
# `:packageGameJar` 默认合并 `:remapFromEnigma` 的输出。传入 -PrwmlGameJar=<path> 可改为合并其他 jar；
# 此处不设置该属性，以便默认值只在一处维护。
#
# 打包后的 jar 运行游戏所需的 JVM 主版本。若当前 Java 版本更低，Java 8 引导程序会在首次启动时通过
# Adoptium API 下载此版本的官方 Temurin 构建，校验校验和并缓存到 ~/.rwml，然后用该版本重新启动，
# 以确保 RWML 字节码和 -javaagent 参数可用。请与 GameEntry#DEFAULT_TARGET_JAVA_VERSION 保持一致。
rwmlTargetJavaVersion=25

# ---- 发布到 Maven Central（Sonatype Central Portal）----
# 在 https://central.sonatype.com/account 创建用户令牌，并在此填写用户名和密码，
# 或导出 ORG_GRADLE_PROJECT_centralUsername / ORG_GRADLE_PROJECT_centralPassword。
# `./gradlew publishAllPublicationsToCentralPortalRepository` 会上传；之后在 Portal 界面完成发布。
# 也可运行 `./gradlew bundleForCentral` 生成 ZIP，再手动上传。
centralUsername=
centralPassword=

# ---- GPG 签名（Central 要求）----
# 建议使用 ASCII 装甲格式的私钥及其密码短语。请勿将它们提交到版本控制。
#   signingInMemoryKey=-----BEGIN PGP PRIVATE KEY BLOCK-----...
#   signingInMemoryPassword=...
# 也可指定本机 gpg 密钥，让构建过程调用 `gpg`：
#   signing.keyId=ABCDEF0123456789
#   signing.password=...
# 本地构建时全部留空即可，系统会自动跳过签名。
signingInMemoryKey=
signingInMemoryPassword=
signing.keyId=
signing.password=
