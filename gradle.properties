# ---- Project coordinates (Maven Central) ----
group=io.github.rwpp-team
version=1.0.0

# ---- Build ----
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true

# Android SDK location (used by the :android app when ANDROID_HOME is not exported).
# android.sdk=D:/androidsdk

# ---- Game packaging (`:packageGameJar`) ----
# RWML is dropped into the game as a *replacement* for its game-lib.jar: the game's code is merged
# into RWML's jar and the game's own entry point appears there as `MainLauncher`, a name the Enigma
# mappings assign to it (`:remapFromEnigma`). RWML provides `com.corrodinggames.rts.java.Main` from
# its own sources, which is what the game launcher starts.
#
# `:packageGameJar` merges the output of `:remapFromEnigma` by default. Pass -PrwmlGameJar=<path> to
# merge a different jar instead; the property is not set here, so that the default stays in one place.
#
# The JVM feature version the packaged jar runs the game on. The Java 8 bootstrap downloads an
# official Temurin build of this version (Adoptium API, checksum verified, cached in ~/.rwml) the
# first time the game is started on anything older, then restarts on it so RWML's bytecode and the
# -javaagent flag are available. Keep in sync with GameEntry#DEFAULT_TARGET_JAVA_VERSION.
rwmlTargetJavaVersion=25

# ---- Maven Central publishing (Sonatype Central Portal) ----
# Create a *user token* at https://central.sonatype.com/account and put its username/password here
# (or export ORG_GRADLE_PROJECT_centralUsername / ORG_GRADLE_PROJECT_centralPassword).
# `./gradlew publishAllPublicationsToCentralPortalRepository` uploads; the release is then finished
# from the Portal UI (or `./gradlew bundleForCentral` produces the ZIP for a manual upload).
centralUsername=
centralPassword=

# ---- GPG signing (required by Central) ----
# Preferred: an ASCII-armored private key + its passphrase. Keep these out of version control.
#   signingInMemoryKey=-----BEGIN PGP PRIVATE KEY BLOCK-----...
#   signingInMemoryPassword=...
# Alternatively point at a local gpg key and let the build shell out to `gpg`:
#   signing.keyId=ABCDEF0123456789
#   signing.password=...
# Leave everything empty for local builds - signing is then skipped automatically.
signingInMemoryKey=
signingInMemoryPassword=
signing.keyId=
signing.password=
