name: release

# 打 tag 即发布：构建可替换的 game-lib.jar 与 Windows 安装程序，上传到同名 Release。
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag，例如 1.0.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 可选：配置后同时上传到 Gitee 发行版，需要带 projects 写权限的令牌。
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # work 子模块提供游戏 jar 与映射，缺了它无法构建 game-lib.jar。
          submodules: recursive
          fetch-depth: 0

      - name: Check tag against gradle.properties
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $line = Select-String -Path gradle.properties -Pattern '^version\s*=\s*(.+)$' | Select-Object -First 1
          if (-not $line) { throw 'gradle.properties has no version entry.' }
          $version = $line.Matches[0].Groups[1].Value.Trim()
          if ($tag.TrimStart('v') -ne $version) {
            throw "Tag $tag does not match gradle.properties version $version."
          }
          # 版本后缀决定这是预览版还是正式版：-rc01、-beta01 等一律按预览版发布，
          # GitHub 的 releases/latest 会因此跳过它们，站点上的下载入口仍指向正式版。
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing $tag (prerelease: $prerelease)"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Build host and installer
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --stacktrace packageGameJar :setup:checkSetup :setup:packageExe
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE." }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $directory = 'build/release'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $files = @(
            'build/dist/game-lib.jar',
            'setup/build/setup/rwml-setup.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
          }
          Get-FileHash -Path $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path (Join-Path $directory 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: |
            build/dist/game-lib.jar
            setup/build/setup/rwml-setup.exe
            build/release/SHA256SUMS.txt

      - name: Publish to Gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        shell: pwsh
        env:
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'rwpp-team' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'RWML' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://gitee.com/api/v5/repos/$env:GITEE_OWNER/$env:GITEE_REPO"
          $headers = @{ Authorization = "token $($env:GITEE_TOKEN)" }
          try {
            $release = Invoke-RestMethod -Uri "$api/releases/tags/$env:RELEASE_TAG" -Headers $headers -Method Get
          } catch {
            $body = @{
              tag_name = $env:RELEASE_TAG
              name = $env:RELEASE_TAG
              body = 'See https://rwpp-team.top/'
              prerelease = ($env:RELEASE_PRERELEASE -eq 'true')
              target_commitish = 'master'
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "$api/releases" -Headers $headers -Method Post -Body $body -ContentType 'application/json'
          }
          $files = @(
            'build/dist/game-lib.jar',
            'setup/build/setup/rwml-setup.exe',
            'build/release/SHA256SUMS.txt'
          )
          foreach ($file in $files) {
            curl.exe -sS -f -X POST "$api/releases/$($release.id)/attach_files" -F "access_token=$($env:GITEE_TOKEN)" -F "file=@$file" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Gitee upload failed: $file" }
            Write-Host "uploaded $file"
          }
