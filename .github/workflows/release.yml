name: release

# 打 tag 即发布：构建可替换的 game-lib.jar 与 Windows 安装程序，上传到同名 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag，例如 v1.0.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 可选：配置后同时上传到 Gitee 发行版，需要带 projects 写权限的令牌。
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # work 子模块提供游戏 jar 与映射，缺了它无法构建 game-lib.jar。
          submodules: recursive
          fetch-depth: 0

      - name: Check tag against gradle.properties
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $line = Select-String -Path gradle.properties -Pattern '^version\s*=\s*(.+)$' | Select-Object -First 1
          if (-not $line) { throw 'gradle.properties has no version entry.' }
          $version = $line.Matches[0].Groups[1].Value.Trim()
          if ($tag.TrimStart('v') -ne $version) {
            throw "Tag $tag does not match gradle.properties version $version."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 模块通过坐标依赖映射后的游戏，而该坐标由 publishGameLibForIde 写入仓库；
      # 设置脚本在配置阶段读取仓库指针，因此发布与编译必须分成两次 Gradle 调用。
      - name: Publish mapped game library
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --stacktrace publishGameLibForIde
          if ($LASTEXITCODE -ne 0) { throw "Publishing the mapped game library failed with exit code $LASTEXITCODE." }

      - name: Build host, installer and MSI
        shell: pwsh
        run: |
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          ./gradlew.bat --no-daemon --stacktrace packageGameJar :setup:checkSetup :setup:packageExe :setup:packageMsi "-Pwix=$wix"
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE." }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $directory = 'build/release'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null

          # 映射后的游戏库是扩展的编译依赖，单独以坐标版本命名，避免与可替换的 game-lib.jar 混淆。
          $versionLine = Select-String -Path 'gradle/libs.versions.toml' -Pattern '^game-lib\s*=\s*"(.+)"$' | Select-Object -First 1
          if (-not $versionLine) { throw 'game-lib version is missing from the version catalog.' }
          $gameLibraryVersion = $versionLine.Matches[0].Groups[1].Value
          $mapped = Get-ChildItem 'build/mapped-game' -Recurse -File -Filter 'game-lib-named.jar' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $mapped) { throw 'The mapped game library jar is missing.' }
          $mappedName = "game-lib-$gameLibraryVersion.jar"
          Copy-Item -LiteralPath $mapped.FullName -Destination (Join-Path $directory $mappedName) -Force

          $files = @(
            'build/dist/game-lib.jar',
            'setup/build/setup/rwml-setup.exe',
            'setup/build/setup/rwml-setup.msi',
            (Join-Path $directory $mappedName)
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
          }
          Get-FileHash -Path $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path (Join-Path $directory 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/dist/game-lib.jar
            setup/build/setup/rwml-setup.exe
            setup/build/setup/rwml-setup.msi
            build/release/*.jar
            build/release/SHA256SUMS.txt

      - name: Publish to Gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        shell: pwsh
        env:
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'rwpp-team' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'RWML' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://gitee.com/api/v5/repos/$env:GITEE_OWNER/$env:GITEE_REPO"
          $headers = @{ Authorization = "token $($env:GITEE_TOKEN)" }
          try {
            $release = Invoke-RestMethod -Uri "$api/releases/tags/$env:RELEASE_TAG" -Headers $headers -Method Get
          } catch {
            $body = @{
              tag_name = $env:RELEASE_TAG
              name = $env:RELEASE_TAG
              body = 'See https://rwpp-team.top/'
              prerelease = $false
              target_commitish = 'main'
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "$api/releases" -Headers $headers -Method Post -Body $body -ContentType 'application/json'
          }
          $files = @(
            'build/dist/game-lib.jar',
            'setup/build/setup/rwml-setup.exe',
            'setup/build/setup/rwml-setup.msi',
            'build/release/SHA256SUMS.txt'
          ) + @(Get-ChildItem 'build/release' -Filter '*.jar' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            curl.exe -sS -f -X POST "$api/releases/$($release.id)/attach_files" -F "access_token=$($env:GITEE_TOKEN)" -F "file=@$file" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Gitee upload failed: $file" }
            Write-Host "uploaded $file"
          }
